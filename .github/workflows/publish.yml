name: Publish to PyPI

# 发布由 tag 触发（v0.1.0 → 0.1.0），也可在 Actions 页面手动触发（workflow_dispatch）。
#
# 采用 **PyPI Trusted Publishing（OIDC）**：不需要在仓库里保存任何 API token。
# 首次使用前需在 PyPI 配置一次发布者：
#   https://pypi.org/manage/account/publishing/ → Add a new pending publisher
#     PyPI Project Name: deslopkit
#     Owner:             grantleyzyf-spec
#     Repository name:   deslopkit
#     Workflow name:     publish.yml
#     Environment name:  pypi
# 配置完成后，推一个 v* tag（或手动 Run workflow）即可自动发布。
# 未配置时本工作流会失败在“上传”这一步——这是预期行为，不会影响其它工作流。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build tooling
        run: python -m pip install --upgrade pip build
      - name: Build sdist and wheel
        run: python -m build
      - name: Check artifacts
        run: |
          python -m pip install twine
          twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/deslopkit
    permissions:
      id-token: write        # 供 OIDC 换取 PyPI 短期凭据，无需保存 token
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish package
        uses: pypa/gh-action-pypi-publish@release/v1
